<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge — Editor</title>
<meta name="description" content="Forge — a browser-based composition and motion-design editor. Build layered compositions, stack effects per layer, animate with keyframes, export video.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="editor.css">
</head>
<body>

<div id="app">

  <!-- ── top: project / tools / preview / export ── -->
  <header class="toolbar">
    <a class="mark" href="index.html" title="Back to home"><span class="wordmark"></span></a>

    <div class="tool-group">
      <button class="btn btn-sm" id="newBtn" title="New composition">New</button>
      <button class="btn btn-sm" id="saveBtn" title="Save project">Save</button>
      <button class="btn btn-sm" id="openBtn" title="Open a saved project">Open</button>
      <input type="file" id="projectInput" accept=".forge,application/json" hidden>
    </div>

    <div class="tool-divider"></div>

    <div class="tool-group">
      <button class="btn btn-icon btn-sm" id="undoBtn" title="Undo (Cmd/Ctrl+Z)" disabled>↶</button>
      <button class="btn btn-icon btn-sm" id="redoBtn" title="Redo (Shift+Cmd/Ctrl+Z)" disabled>↷</button>
    </div>

    <div class="tool-divider"></div>

    <div class="tool-group">
      <button class="btn btn-sm" id="addImageBtn" title="Add an image layer">+ Image</button>
      <button class="btn btn-sm" id="addVideoBtn" title="Add a video layer">+ Video</button>
      <button class="btn btn-sm" id="addTextBtn" title="Add a text layer">+ Text</button>
      <button class="btn btn-sm" id="addSolidBtn" title="Add a solid background layer">+ Solid</button>
      <button class="btn btn-sm" id="audioBtn" title="Load an audio track for effects to react to">♪ Audio</button>
      <input type="file" id="imageInput" accept="image/*" multiple hidden>
      <input type="file" id="videoInput" accept="video/*" multiple hidden>
      <input type="file" id="audioInput" accept="audio/*" hidden>
    </div>

    <div class="tool-group zoom-group">
      <button class="btn btn-icon btn-sm" id="zoomOutBtn" title="Zoom out">−</button>
      <span class="readout" id="zoomLabel">100%</span>
      <button class="btn btn-icon btn-sm" id="zoomInBtn" title="Zoom in">+</button>
      <button class="btn btn-sm" id="fitBtn" title="Fit to screen (F)">Fit</button>
    </div>

    <div class="tool-group right">
      <a class="btn btn-icon btn-sm" id="helpBtn" href="guide.html" title="Guide">?</a>
      <span class="readout" id="perfReadout" title="Estimated GPU cost · measured frame time">0 · 0ms</span>
      <button class="btn btn-primary" id="exportBtn">Export</button>
    </div>
  </header>

  <div class="body">

    <!-- ── left: scene / layers ── -->
    <aside class="panel panel-left">
      <div class="panel-title">SCENE</div>
      <div id="layerList" class="layer-list"></div>
      <p class="hint panel-foot">Drag to reorder · double-click to rename · top of list renders in front</p>
    </aside>

    <!-- ── centre: canvas ── -->
    <main class="stage-area" id="stageWrap">
      <div class="stage-holder">
        <canvas id="stage"></canvas>
        <div id="overlay" class="stage-overlay"></div>
      </div>
      <p class="drop-hint">Drop images or videos anywhere to add them as layers</p>
    </main>

    <!-- ── right: contextual inspector ── -->
    <aside class="panel panel-right" id="panelRight">
      <div class="panel-resize" id="panelResize" title="Drag to resize"></div>
      <div class="panel-title">INSPECTOR</div>
      <div id="inspector" class="inspector"></div>
    </aside>

  </div>

  <!-- ── bottom: timeline ── -->
  <section class="timeline">
    <div class="transport">
      <button class="btn btn-icon btn-sm" id="toStartBtn" title="Go to start">⏮</button>
      <button class="btn btn-icon btn-sm" id="playBtn" title="Play / pause (Space)">▶</button>
      <button class="btn btn-icon btn-sm" id="toEndBtn" title="Go to end">⏭</button>
      <span class="readout" id="timeLabel">0.00 / 6.00s</span>
    </div>
    <div class="timeline-body" id="timelineBody">
      <div class="ruler-row">
        <div class="ruler-spacer"></div>
        <div class="ruler" id="timelineRuler"></div>
      </div>
      <div id="timelineTracks" class="tracks"></div>
      <div class="playhead" id="playhead"></div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <div class="modal-host" id="modalHost" hidden></div>
</div>

<script src="fx.js"></script>
<script src="audio.js"></script>
<script src="comp.js"></script>
<script src="ui.js"></script>
</body>
</html>
