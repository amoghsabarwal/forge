<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge — Interactive Motion Editor</title>
<meta name="description" content="Forge — design interactive motion for the web with shaders, media, 3D and interaction in a visual canvas editor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="shell">
  <div class="shell-bar">
    <a class="shell-mark" href="index.html" title="Back to home">
      <svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" rx="2" transform="rotate(45 7 7)" style="fill:var(--accent)"/></svg>
      FORGE
    </a>
    <div class="editor-context">INTERACTIVE MOTION</div>
    <span class="shell-hint">design → animate → ship to the web</span>
  </div>

  <div class="mode-container" id="modeShaders">
    <div class="mode-inner">
      <header class="topbar">
        <div class="transport">
          <div class="loop-meter">
            <svg viewBox="0 0 32 32" width="32" height="32">
              <circle class="ring-bg" cx="16" cy="16" r="13"></circle>
              <circle class="ring-fg" id="ringFg" cx="16" cy="16" r="13"></circle>
            </svg>
            <span class="loop-time" id="loopTime">0.0s / 12.0s</span>
          </div>
          <button class="btn btn-icon" id="playBtn" title="Play / pause">▶</button>
          <button class="btn btn-primary" id="exportBtn" disabled>Export</button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar sidebar-left">
          <div class="panel-title">
            <span>LAYERS <span id="mediaCount">· 0</span></span>
            <span class="panel-title-actions">
              <button class="panel-icon-btn" id="shuffleBtn" title="Shuffle layer order">Shuffle</button>
            </span>
          </div>
          <div class="media-drop" id="mediaDrop">
            <input type="file" id="mediaInput" accept="image/*" multiple hidden>
            <p>+ Add image layer</p>
          </div>
          <div class="layer-hint">Each asset is an independent layer. Effects and transforms should belong to the selected layer.</div>
          <div id="mediaList"></div>
        </aside>

        <section class="viewport" id="viewport">
          <canvas id="outputCanvas" class="hidden"></canvas>
          <div class="dropzone" id="dropzone">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M12 16V4M12 4L7 9M12 4l5 5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p>Drop an image to create a layer</p>
            <span>then build the composition in the canvas</span>
          </div>
        </section>

        <aside class="sidebar sidebar-right" id="inspector"></aside>
      </div>
    </div>
  </div>
</div>

<script src="shell.js"></script>
<script src="composer.js"></script>
</body>
</html>
