<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge — Interactive Motion Editor</title>
<meta name="description" content="Forge — design interactive motion for the web with shaders, media, 3D and interaction in a visual canvas editor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="shell">
  <div class="shell-bar">
    <a class="shell-mark" href="index.html" title="Back to home">FORGE</a>
    <div class="editor-context">INTERACTIVE MOTION</div>
    <span class="shell-hint">design → animate → ship to the web</span>
  </div>
  <div class="mode-container" id="modeShaders">
    <div class="mode-inner">
      <header class="topbar"><div class="transport">
        <span id="loopTime">0.0s / 12.0s</span>
        <button class="btn btn-icon" id="playBtn">▶</button>
        <button class="btn btn-primary" id="exportBtn" disabled>Export</button>
      </div></header>
      <div class="workspace">
        <aside class="sidebar sidebar-left">
          <div class="panel-title"><span>LAYERS <span id="mediaCount">· 0</span></span><button class="panel-icon-btn" id="shuffleBtn">Shuffle</button></div>
          <div class="media-drop" id="mediaDrop"><input type="file" id="mediaInput" accept="image/*" multiple hidden><p>+ Add image layer</p></div>
          <div class="layer-hint">Assets are independent layers. Select a layer to edit its transforms and effects.</div>
          <div id="mediaList"></div>
        </aside>
        <section class="viewport" id="viewport">
          <canvas id="outputCanvas" class="hidden"></canvas>
          <div class="dropzone" id="dropzone"><p>Drop an image to create a layer</p><span>or use + Add image layer</span></div>
        </section>
        <aside class="sidebar sidebar-right" id="inspector"></aside>
      </div>
    </div>
  </div>
</div>
<script src="shell.js"></script>
<script src="composer.js"></script>
<script src="layer-engine.js"></script>
</body>
</html>
